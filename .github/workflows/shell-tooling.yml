name: Shell Tooling

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck contracts
        run: pnpm --filter @socrates/contracts typecheck
      - name: Typecheck workspace
        run: pnpm --filter @socrates/workspace typecheck
      - name: Typecheck core
        run: pnpm --filter @socrates/core typecheck
      - name: Typecheck server
        run: pnpm --filter @socrates/server typecheck
      - name: Test contracts
        run: pnpm --filter @socrates/contracts test
      - name: Test workspace
        run: pnpm --filter @socrates/workspace test
      - name: Test core
        run: pnpm --filter @socrates/core test
      - name: Test server shell contracts
        if: runner.os != 'Windows'
        run: |
          pnpm --filter @socrates/server test
